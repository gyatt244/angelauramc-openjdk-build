name: Custom Java 25 Build
on:
  workflow_dispatch:

jobs:
  build:
    name: Build JRE
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Homebrew and Build Tools
        run: |
          brew install make wget xz

      - name: Check Folder Files
        run: |
          # This will print out all files so we can see where the build rules are hidden
          ls -lah

      - name: Run Build Script
        run: |
          export SLIMMED=0
          # Let's try running the direct shell script or the ios target rule
          ./buildjdk.sh || /opt/homebrew/bin/gmake ios || /opt/homebrew/bin/gmake

